apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: primary-pool
  namespace: kafka-primary
  labels:
    strimzi.io/cluster: primary-cluster
spec:
  replicas: 3
  roles:
    - broker
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: true
  resources:
    requests:
      cpu: "200m"
      memory: 512Mi
    limits:
      cpu: "400m"
      memory: 768Mi
